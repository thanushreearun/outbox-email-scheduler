name: outbox-email-scheduler

# Local infrastructure only. The API, worker and web app run on the host (npm run dev)
# so they can be debugged directly. Every service has a real readiness health check;
# `docker compose up -d --wait` blocks until all of them report healthy.

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: outbox
      POSTGRES_PASSWORD: outbox
      POSTGRES_DB: outbox
    ports:
      # 5433 on the host to avoid clashing with a locally installed PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        ['CMD-SHELL', "pg_isready -U outbox -d outbox && psql -U outbox -d outbox -c 'select 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    # AOF persistence so delayed BullMQ jobs survive a Redis restart.
    # noeviction is REQUIRED by BullMQ: evicting queue keys silently loses jobs.
    command:
      ['redis-server', '--appendonly', 'yes', '--appendfsync', 'everysec', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      # Security is disabled for LOCAL development only. See README "Deployment guidance".
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=false
      - cluster.routing.allocation.disk.threshold_enabled=false
    ports:
      - '9200:9200'
    volumes:
      - es-data:/usr/share/elasticsearch/data
    mem_limit: 1g
    healthcheck:
      # A running container is not a ready cluster: wait for at least yellow health.
      test:
        [
          'CMD-SHELL',
          "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  es-data:
